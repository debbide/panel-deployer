name: build

# 私有仓库专用：产物 jar 里含构建时注入的 token，
# 公开仓库的 Actions 产物任何人可下载，绝不能在这里构建。
#
# 手动 Run workflow 时直接填 6 个值即可烘焙进 jar；
# 留空则回退到仓库 Secrets（CF_TUNNEL_TOKEN / CF_DOMAIN / WEBTERM_TOKEN /
# WEBTERM_PORT / VNC_PASSWORD / VNC_PORT）。
# 注意：填的值会显示在本次 Run 的页面上（仅仓库可见），不要截图外发。
on:
  workflow_dispatch:
    inputs:
      cf_tunnel_token:
        description: 'CF 隧道 token（named 模式才需要）'
        required: false
      cf_domain:
        description: 'CF 隧道域名（如 panel.example.com，named 模式展示用）'
        required: false
      webterm_token:
        description: 'webterm 访问 token'
        required: false
      webterm_port:
        description: 'webterm 端口'
        required: false
        default: '7681'
      vnc_password:
        description: 'VNC 密码（留空则不启用 noVNC）'
        required: false
      vnc_port:
        description: 'noVNC 网页端口'
        required: false
        default: '6080'
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build server.jar
        run: ./build.sh
        env:
          # 手动输入优先，留空回退到 Secrets（tag 发版时没有输入框，走 Secrets）
          CF_TUNNEL_TOKEN: ${{ github.event.inputs.cf_tunnel_token || secrets.CF_TUNNEL_TOKEN }}
          CF_DOMAIN: ${{ github.event.inputs.cf_domain || secrets.CF_DOMAIN }}
          WEBTERM_TOKEN: ${{ github.event.inputs.webterm_token || secrets.WEBTERM_TOKEN }}
          WEBTERM_PORT: ${{ github.event.inputs.webterm_port || secrets.WEBTERM_PORT }}
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password || secrets.VNC_PASSWORD }}
          VNC_PORT: ${{ github.event.inputs.vnc_port || secrets.VNC_PORT }}
          VERSION: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server.jar
          path: dist/server.jar
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/server.jar
          generate_release_notes: true
